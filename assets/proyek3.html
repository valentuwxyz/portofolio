<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pemesanan Sarapan Pagi Bu Mira</title>
</head>
    <body>
    <h2><b>Form Pemesanan Sarapan Pagi Bu Mira</b></h2>
    <p>Silakan isi form di bawah ini untuk melakukan pemesanan sarapan pagi di warung Bu Mira</p>

    <form>
        <table>
                <tr>
                    <td><label for="">Tulis Nama Anda: </label></td>
                    <td>: <input type="text"></td>
                </tr>

                <tr>
                    <td><label for="">Tulis Email Anda: </label></td>
                    <td>: <input type="email"></td>
                </tr>

                <tr>
                    <td><label for="">Nomor Handphone:</label></td>
                    <td>: <input type="text"></td>
                </tr>

                <tr>
                    <td><label for="Sarapan">Pilih sarapan yang ingin anda pesan</label></td>
                    <td>
                    :<input type="radio" name="Sarapan" value="Nasi Gurih">Nasi Gurih <br>
                    :<input type="radio" name="Sarapan" value="Nasi Lemak">Nasi Lemak <br>
                    :<input type="radio" name="Sarapan" value="Lontong Sayur">Lontung Sayur <br>
                    :<input type="radio" name="Sarapan" value="Roti telur">Roti Telur
                    </td>
                </tr>

                <tr>
                    <td><label for="">Jumlah Pesanan:</label></td>
                    <td>:<input type="number"></td>
                </tr>

                <tr>
                    <td><label for="">Tanggal Pemesanan Sarapan: </label></td>
                    <td>:<input type="date"></td>
                </tr>

                <tr>
                    <td><label for="">Waktu Penerimaan Pesanan:</label></td>
                    <td>: <input type="time"></td>
                </tr>

                <tr>
                    <td><label>Jenis Pesanan</label></td>
                    <td>
                    :<input type="radio" name="jenis_pesanan" value="Makan ditempat"> Makan ditempat <br>
                    <input type="radio" name="jenis_pesanan" value="Dibungkus"> Dibungkus <br>
                    <input type="radio" name="jenis_pesanan" value="Diantar"> Diantar
                    </td>
                </tr>

                <tr>
                    <td><label for="">Menu Tambahan:</label></td>
                    <td>
                    <input type="checkbox" name="menu_tambahan" value="Telur">Telur <br>
                    <input type="checkbox" name="menu_tambahan" value="Kerupuk">Kerupuk <br>
                    <input type="checkbox" name="menu_tambahan" value="Teh Manis">Teh Manis <br>
                    <input type="checkbox" name="menu_tambahan" value="Gorengan"> Gorengan 
                    </td>
                </tr>

                <tr>
                    <td><label for="">Silahkan Upload Bukti Pembayaran:</label></td>
                    <td><input type="file"></td>
                </tr>

                <tr>
                    <br>
                    <td><input type="submit" value="Kirim"></td>
                    <td><input type="reset" value="Hapus"></td>
                 </tr>

            </table>
        </form>
    </body>
</html>
